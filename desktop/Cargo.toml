[package]
name = "nex_design"
version = "0.11.8"
description = "NexDesign desktop app"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "NexDesign"
path = "src/main.rs"

[lib]
name = "nex_design_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools feature removed — the toggle in menu_events.rs is already
# #[cfg(debug_assertions)]-gated, so release builds stay lean.
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = { version = "2.4.5", features = ["watch"] }
tauri-plugin-shell = "2"
zstd = "0.13"
zip = { version = "2", default-features = false }
font-kit = "0.14.3"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", branch = "dev" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# ── Release profile: maximum Windows performance ─────────────────────────────
# lto=true        — whole-program link-time optimisation across all crates
# codegen-units=1 — single LLVM codegen unit: more inlining, smaller binary
# panic=abort     — removes unwinding machinery (~50–100 KB saved on Windows)
# strip=symbols   — strips debug symbols from the .exe
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# ── Dev profile: faster incremental builds ────────────────────────────────────
# opt-level=1 gives minimal optimisations without the full compile cost of
# level 3, making repeated cargo build cycles noticeably faster.
[profile.dev]
opt-level = 1

